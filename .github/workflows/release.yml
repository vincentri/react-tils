name: Release

# On main: opens a "Version Packages" PR from pending changesets. Merging that PR
# publishes to npm with provenance and creates a git tag (scripts/publish.ts).
# Auth: npm trusted publishing (OIDC) for this workflow, set up on npmjs.com.
# No token is stored; the id-token permission below lets npm verify this workflow.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
