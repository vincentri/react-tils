name: Release

# On main: opens a "Version Packages" PR from pending changesets. Merging that PR
# publishes to npm with provenance and creates a git tag.
# Setup: add an NPM_TOKEN repo secret (an npm automation token), or configure npm
# trusted publishing for this workflow and remove NODE_AUTH_TOKEN below.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # changesets/action reads NPM_TOKEN; without it, it switches to trusted publishing.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      # A publish can report success without reaching npm; check the registry itself.
      - if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for i in 1 2 3 4 5 6; do
            npm view "$name@$version" version && exit 0
            sleep 10
          done
          echo "::error::$name@$version is not on npm"
          exit 1
