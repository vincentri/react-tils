<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-tils — React hooks for browser state</title>
    <meta
      name="description"
      content="React hooks for browser state, correct on the first frame: docs and a live demo of every hook."
    />
    <script>
      // The saved theme, before the first paint, so a dark page never flashes light.
      try {
        const theme = JSON.parse(localStorage.getItem('react-tils-theme'))
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
